<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Rubén Schnettler">
  <defs>
    <radialGradient id="g" cx="78%" cy="30%" r="55%">
      <stop offset="0" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c" cx="8%" cy="110%" r="45%">
      <stop offset="0" stop-color="#56c5bd" stop-opacity="0.154"/>
      <stop offset="1" stop-color="#56c5bd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#aab3c5" fill-opacity="0.18"/>
    </pattern>
    <style>
      .pulse { animation: p 6s ease-in-out infinite; transform-origin: 940px 120px; }
      @keyframes p { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="400" rx="20" fill="#0b0f19"/>
  <rect width="1200" height="400" rx="20" fill="url(#dots)"/>
  <rect class="pulse" width="1200" height="400" rx="20" fill="url(#g)"/>
  <rect width="1200" height="400" rx="20" fill="url(#c)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="19.5" fill="none" stroke="#ffffff14"/>

  <g class="fade">
    <rect x="72" y="84" width="28" height="2" fill="#d4af37"/>
    <text x="112" y="90" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="15" letter-spacing="3" fill="#d4af37">GESTIÓN ESTRATÉGICA · TECNOLOGÍA · EDUCACIÓN</text>
  </g>
  <text class="fade d2" x="68" y="190" font-family="Fraunces, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-size="84" font-weight="600" fill="#f4f1ea">Rubén Schnettler</text>
  <g class="fade d3" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#aab3c5">
    <text x="72" y="248">Pienso como ingeniero, enseño como profesor</text>
    <text x="72" y="282">y actúo como consultor.</text>
  </g>
  <g class="fade d3" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#aab3c5">
    <circle cx="78" cy="336" r="4" fill="#56c5bd"/>
    <text x="92" y="341">Viña del Mar, Chile</text>
    <text x="270" y="341" fill="#ffffff14">/</text>
    <text x="294" y="341">Fundador de <tspan fill="#d4af37">AntoStudio</tspan></text>
  </g>
</svg>
