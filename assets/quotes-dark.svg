<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Nunca olvides por qué empezaste.">
  <style>
    .q { animation: cycle 36s linear infinite; }
    @keyframes cycle { 0% { opacity: 1; } 14.67% { opacity: 1; } 16.67% { opacity: 0; } 98% { opacity: 0; } 100% { opacity: 1; } }
  </style>
  <rect x="560" y="22" width="80" height="1.5" fill="#d4af37" fill-opacity="0.7"/>
  <g class="q" style="animation-delay:-36s" opacity="1"><text x="600" y="84" text-anchor="middle" font-family="Fraunces, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-style="italic" font-size="34" fill="#f4f1ea">Nunca olvides por qué empezaste.</text></g><g class="q" style="animation-delay:-30s" opacity="0"><text x="600" y="84" text-anchor="middle" font-family="Fraunces, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-style="italic" font-size="34" fill="#f4f1ea">Primero entender, después construir.</text></g><g class="q" style="animation-delay:-24s" opacity="0"><text x="600" y="84" text-anchor="middle" font-family="Fraunces, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-style="italic" font-size="34" fill="#f4f1ea">Enseñar es aprender dos veces.</text><text x="600" y="120" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#d4af37">— JOSEPH JOUBERT</text></g><g class="q" style="animation-delay:-18s" opacity="0"><text x="600" y="84" text-anchor="middle" font-family="Fraunces, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-style="italic" font-size="27" fill="#f4f1ea">La única manera de hacer un gran trabajo es amar lo que haces.</text><text x="600" y="120" text-anchor="middle" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#d4af37">— STEVE JOBS</text></g><g class="q" style="animation-delay:-12s" opacity="0"><text x="600" y="84" text-anchor="middle" font-family="Fraunces, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-style="italic" font-size="34" fill="#f4f1ea">Escucha bien. Mira los datos con atención.</text></g><g class="q" style="animation-delay:-6s" opacity="0"><text x="600" y="84" text-anchor="middle" font-family="Fraunces, 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif" font-style="italic" font-size="27" fill="#f4f1ea">Lo simple bien hecho vale más que lo complejo a medias.</text></g>
</svg>
